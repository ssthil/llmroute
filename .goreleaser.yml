# GoReleaser configuration for llmroute.
# Docs: https://goreleaser.com
version: 2

project_name: llmroute

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: llmroute
    main: .
    binary: llmroute
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # No CGO needed: modernc.org/sqlite is pure Go.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"

brews:
  - name: llmroute
    repository:
      owner: ssthil
      name: homebrew-senthil-tools
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/ssthil/llmroute"
    description: "A native, multi-LLM routing proxy CLI"
    license: "MIT"
    install: |
      bin.install "llmroute"
    test: |
      system "#{bin}/llmroute", "--version"

release:
  draft: false
  prerelease: auto
  # Replace artifacts on an existing release so a moved tag can be re-released
  # cleanly instead of failing on duplicate asset uploads.
  mode: replace
